# dsh-auto-update：DSH 宿主启动后在后台检查并安装已装插件的更新。
#
# insert 行的 id / name **必须等于包名**，否则静默装载不上（dsh-kb-sync 的 INSTALL-PATH 教训）。
#
# 两个 entry：
#   dsh-auto-update       启动半部：延迟 delayMs 后跑一次更新流水线
#   dsh-auto-update/tools 工具半部：auto_update_status / auto_update_run
#
# 覆盖默认值：在 profile 的 cordis.patch.yml 里加同 id 的配置条目，例如
#   - id: dsh-auto-update
#     name: dsh-auto-update
#     config:
#       delayMs: 30000
#       dryRun: false
# 关掉：给 profile 条目加 `disabled: true`（回滚 = 删这一行）。
#
# dryRun：代码默认 true（安全兜底）；本机补丁在 2026-11-14 验证后已改 false。
# 想先看候选不安装：把下面两处 dryRun 改回 true 并重启。
- insert:
    - id: dsh-auto-update
      name: 'dsh-auto-update'
      config:
        enabled: true
        delayMs: 15000
        # agent 在跑时只重试 2 分钟：再久就可能撞上用户正在用的会话（无感要求）。
        busyRetryForMs: 120000
        dryRun: false
        skip:
          - dshmarket
          - dsh-auto-update
    - id: dsh-auto-update-tools
      name: 'dsh-auto-update/tools'
      config:
        enabled: true
        dryRun: false
        skip:
          - dshmarket
          - dsh-auto-update
